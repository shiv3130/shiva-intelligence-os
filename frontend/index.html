<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIVA Career Intelligence OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#020617', // slate-950
            surface: '#0f172a', // slate-900
            surfaceHighlight: '#1e293b', // slate-800
            primary: '#06b6d4', // cyan-500
            primaryHover: '#0891b2', // cyan-600
            accent: '#10b981', // emerald-500
            danger: '#f43f5e', // rose-500 (updated for cyber theme)
            warning: '#f59e0b', // amber-500
            textMain: '#f8fafc', // slate-50
            textMuted: '#94a3b8', // slate-400
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          backgroundImage: {
            'grid-pattern': 'linear-gradient(to right, rgba(30, 41, 59, 0.5) 1px, transparent 1px), linear-gradient(to bottom, rgba(30, 41, 59, 0.5) 1px, transparent 1px)',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- React Flow Base CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.1/dist/style.css">
  
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden; /* App handles its own scrolling */
    }
    /* Custom Scrollbar for a premium feel */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617; 
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b; 
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #06b6d4; 
    }
    
    /* Cyber-Professional Glassmorphism */
    .glass-panel {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    
    /* Neon Utilities */
    .neon-text {
      text-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
    }
    .neon-text-green {
      text-shadow: 0 0 15px rgba(16, 185, 129, 0.6);
    }
    .neon-text-red {
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
    }
    
    .neon-border-green {
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.15), inset 0 0 10px rgba(16, 185, 129, 0.1);
    }
    .neon-border-red {
      border-color: rgba(244, 63, 94, 0.5);
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.15), inset 0 0 10px rgba(244, 63, 94, 0.1);
    }
    .neon-border-cyan {
      border-color: rgba(6, 182, 212, 0.5);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.15), inset 0 0 10px rgba(6, 182, 212, 0.1);
    }
  </style>

  <!-- Load PDF.js globally to avoid ESM worker version mismatches -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (globalThis.pdfjsLib) {
      globalThis.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  </head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
